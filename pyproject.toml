[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geosyn"
version = "0.1.0"
description = "Geometry-grounded articulated robot state estimation from synthetic data"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [{name = "GeoSyn contributors"}]
dependencies = [
  "torch>=2.4,<2.6",
  "torchvision>=0.19,<0.21",
  "timm==1.0.28",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "pytorch-kinematics==0.10.0",
  "PyYAML==6.0.3",
  "Pillow==12.3.0",
  "scipy==1.15.3",
  "einops==0.8.2",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party_licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["geosyn*"]

[tool.setuptools.package-data]
geosyn = ["assets/*.urdf", "assets/*.npz", "assets/*.json", "assets/*.txt"]

